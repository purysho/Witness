# Code signing is optional and switches on by itself once these repository
# secrets exist (Settings -> Secrets and variables -> Actions):
#   Windows (Azure Artifact Signing): AZURE_TENANT_ID, AZURE_CLIENT_ID,
#     AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#     AZURE_CERT_PROFILE
#   macOS (Developer ID + notarization): APPLE_CERT_P12, APPLE_CERT_PASSWORD,
#     APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
# Windows signs the NSIS installer; macOS signing and notarization is done by
# the Tauri bundler.
# Without them, builds are published unsigned, as before.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish as this tag (for example v1.1.1). Leave empty to build without publishing.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify release version metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          if ($env:RELEASE_TAG) {
            python tools/check-version-metadata.py --tag "$env:RELEASE_TAG"
          } else {
            python tools/check-version-metadata.py
          }

      - name: Verify Windows distribution metadata
        run: python tools/check-distribution-metadata.py

      - name: Install frozen-engine tooling
        run: python -m pip install --upgrade pip -e "engine[build]"

      - name: Build frozen Witness engine
        run: python tools/build-sidecar.py

      - name: Smoke frozen engine before packaging
        shell: pwsh
        run: |
          $sidecar = Get-ChildItem "apps/desktop/src-tauri/binaries/witness-engine-*.exe" | Select-Object -First 1
          if (-not $sidecar) { throw "Frozen Witness engine was not created" }
          python tools/smoke-sidecar.py --engine $sidecar.FullName

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json

      - name: Sign Windows installer
        # Runs only once the Artifact Signing secrets exist; see the header of this file.
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\apps\desktop\src-tauri\target\release\bundle\nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Smoke installed Windows package
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not created" }
          ./tools/smoke-installed.ps1 -Installer $installer.FullName

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $installers = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe"
          if (-not $installers) { throw "NSIS installer was not created" }
          $lines = foreach ($installer in $installers) {
            $hash = Get-FileHash $installer.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($installer.Name)"
          }
          $lines | Set-Content -Encoding ascii "SHA256SUMS.txt"
          Get-Content "SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: witness-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  unix-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            bundles: dmg
            artifacts: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            platform: linux
            bundles: appimage,deb
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    env:
      NO_STRIP: 'true'
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux WebView and bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Verify release version metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then python tools/check-version-metadata.py --tag "$RELEASE_TAG"; else python tools/check-version-metadata.py; fi

      - name: Install frozen-engine tooling
        run: python -m pip install --upgrade pip -e "engine[build]"

      - name: Build frozen Witness engine
        run: python tools/build-sidecar.py

      - name: Smoke frozen engine before packaging
        run: |
          sidecar=$(ls apps/desktop/src-tauri/binaries/witness-engine-* | head -n 1)
          test -n "$sidecar" || { echo "Frozen Witness engine was not created"; exit 1; }
          python tools/smoke-sidecar.py --engine "$sidecar"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Enable macOS signing and notarization
        # Tauri treats an empty APPLE_CERTIFICATE as a certificate to import, so
        # these are only exported when the secrets exist.
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        run: |
          {
            echo "APPLE_CERTIFICATE<<CERT_EOF"; echo "$APPLE_CERT_P12"; echo "CERT_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET"
            echo "APPLE_ID=$APPLE_ID_SECRET"
            echo "APPLE_PASSWORD=$APPLE_APP_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"
          } >> "$GITHUB_ENV"

      - name: Build ${{ matrix.platform }} bundles
        working-directory: apps/desktop
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: witness-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: [windows-package, unix-package]
    if: github.ref_type == 'tag' || inputs.version != ''
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: witness-*
          path: dist
          merge-multiple: true
      - name: Collect files and generate SHA-256 checksums
        # The Linux artifact keeps its appimage/ and deb/ folders, so flatten
        # everything into one directory before checksumming and uploading.
        run: |
          mkdir release
          find dist -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub release
        run: |
          notes="RELEASE_NOTES_${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --notes-file "$notes" --title "Witness $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --generate-notes --title "Witness $RELEASE_TAG"
          fi
