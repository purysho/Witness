name: Quality Baseline

on:
  workflow_dispatch:
  push:
    branches: [v1.1]
    paths:
      - ".github/quality-trigger-v1.1"

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Witness engine
        run: python -m pip install --upgrade pip -e engine
      - name: Run fixed Lab quality baseline
        run: python tools/quality-baseline.py --output quality-baseline.json
      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: witness-quality-windows-${{ github.run_id }}
          path: quality-baseline.json
          if-no-files-found: error
          retention-days: 30
