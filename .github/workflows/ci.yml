name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install engine and test tooling
        run: python -m pip install --upgrade pip pytest -e .
      - name: Verify SQLite FTS5
        run: python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute('create virtual table t using fts5(x)'); print(sqlite3.sqlite_version)"
      - name: Run engine tests
        run: python -m pytest -q
      - name: Compile engine package
        run: python -m compileall -q src

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine
        run: python -m pip install -e engine
      - name: Verify generated RPC contracts
        run: python tools/generate-contracts.py --check

  desktop-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build desktop frontend
        run: npm run build

  desktop-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Tauri host
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  packaged-sidecar-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frozen-engine tooling
        run: python -m pip install --upgrade pip -e "engine[build]"
      - name: Build frozen Witness engine
        run: python tools/build-sidecar.py
      - name: Smoke frozen engine and persistence
        shell: pwsh
        run: |
          $sidecar = Get-ChildItem "apps/desktop/src-tauri/binaries/witness-engine-*.exe" | Select-Object -First 1
          if (-not $sidecar) { throw "Frozen Witness engine was not created" }
          python tools/smoke-sidecar.py --engine $sidecar.FullName
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build release host with bundled sidecar config
        working-directory: apps/desktop
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json --no-bundle
