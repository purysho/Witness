[project]
name = "witness-engine"
version = "1.1.2"
description = "Evidence-first RAG engine"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10.0",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.0",
]
vision = [
  "open-clip-torch>=3.3,<4",
]
build = [
  "pyinstaller>=6.10,<7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
