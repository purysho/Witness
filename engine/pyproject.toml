[project]
name = "witness-engine"
version = "0.1.0"
description = "Evidence-first RAG engine"
requires-python = ">=3.12"
dependencies = [
  "pypdf>=5.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
